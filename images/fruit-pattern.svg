<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- a little face shared by the fruit -->
    <g id="face">
      <circle cx="-3.4" cy="0" r="1.3" fill="#4a2414"/>
      <circle cx="3.4" cy="0" r="1.3" fill="#4a2414"/>
      <path d="M-1.8 2.6 Q0 4.4 1.8 2.6" fill="none" stroke="#4a2414" stroke-width="1" stroke-linecap="round"/>
      <circle cx="-6" cy="2.6" r="1.6" fill="#ff8fa8" opacity=".8"/>
      <circle cx="6" cy="2.6" r="1.6" fill="#ff8fa8" opacity=".8"/>
    </g>

    <g id="strawberry">
      <path d="M0 15 C-11 9 -14 -2 -11 -7.5 C-8 -12 -2.5 -11 0 -8.5 C2.5 -11 8 -12 11 -7.5 C14 -2 11 9 0 15Z" fill="#f0443a"/>
      <g fill="#ffe3a3">
        <ellipse cx="-6" cy="-3" rx=".8" ry="1.2"/><ellipse cx="6.5" cy="-3.5" rx=".8" ry="1.2"/>
        <ellipse cx="-7" cy="5" rx=".8" ry="1.2"/><ellipse cx="7" cy="5.5" rx=".8" ry="1.2"/>
        <ellipse cx="0" cy="10" rx=".8" ry="1.2"/><ellipse cx="-3" cy="-6" rx=".8" ry="1.2"/><ellipse cx="3.5" cy="-6.5" rx=".8" ry="1.2"/>
      </g>
      <path d="M-8 -9.5 L-3.5 -7 L0 -12.5 L3.5 -7 L8 -9.5 L5 -5 L-5 -5Z" fill="#6cbe57"/>
      <use xlink:href="#face" href="#face" transform="translate(0 1.5)"/>
    </g>

    <g id="orange">
      <circle r="11.5" fill="#f7923a"/>
      <ellipse cx="-4.5" cy="-5.5" rx="3" ry="2" fill="#fff" opacity=".45" transform="rotate(-30 -4.5 -5.5)"/>
      <path d="M0 -11.5 L0 -14.5" stroke="#7a4a22" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M0.5 -13.5 C4 -18 10 -16 11 -12.5 C7 -11 3 -11.5 0.5 -13.5Z" fill="#6cbe57"/>
      <use xlink:href="#face" href="#face" transform="translate(0 1)"/>
    </g>

    <g id="slice">
      <circle r="10.5" fill="#f7923a"/>
      <circle r="8.6" fill="#ffd27a"/>
      <g stroke="#f7a94a" stroke-width="1.3" stroke-linecap="round">
        <path d="M0 0 L0 -8"/><path d="M0 0 L5.7 -5.7"/><path d="M0 0 L8 0"/><path d="M0 0 L5.7 5.7"/>
        <path d="M0 0 L0 8"/><path d="M0 0 L-5.7 5.7"/><path d="M0 0 L-8 0"/><path d="M0 0 L-5.7 -5.7"/>
      </g>
      <circle r="1.4" fill="#fff3d6"/>
    </g>

    <g id="cherries">
      <path d="M-5 4 C-4 -4 0 -9 3 -12 M5 5 C5 -3 4 -8 3 -12" fill="none" stroke="#7a4a22" stroke-width="1.3" stroke-linecap="round"/>
      <path d="M3 -12 C7 -15 12 -13 12 -10 C8 -9 5 -10 3 -12Z" fill="#6cbe57"/>
      <circle cx="-5" cy="7" r="5.2" fill="#e8452c"/>
      <circle cx="5.5" cy="8" r="5.2" fill="#ee5a36"/>
      <circle cx="-6.6" cy="5.2" r="1.4" fill="#fff" opacity=".6"/>
      <circle cx="3.9" cy="6.2" r="1.4" fill="#fff" opacity=".6"/>
    </g>

    <path id="sparkle" d="M0 -6.5 Q1 -1 6.5 0 Q1 1 0 6.5 Q-1 1 -6.5 0 Q-1 -1 0 -6.5Z" fill="#ffc15e"/>
    <path id="heart" d="M0 4.5 C-6.5 -0.5 -5.5 -6.5 -2.2 -6.5 C-1 -6.5 0 -5.6 0 -4.4 C0 -5.6 1 -6.5 2.2 -6.5 C5.5 -6.5 6.5 -0.5 0 4.5Z" fill="#f79bb8"/>
  </defs>

  <use href="#strawberry" xlink:href="#strawberry" transform="translate(42 50) rotate(-12)"/>
  <use href="#orange" xlink:href="#orange" transform="translate(172 44) rotate(9)"/>
  <use href="#cherries" xlink:href="#cherries" transform="translate(118 128) rotate(-6)"/>
  <use href="#slice" xlink:href="#slice" transform="translate(36 182) rotate(20)"/>
  <use href="#strawberry" xlink:href="#strawberry" transform="translate(196 178) rotate(14) scale(.82)"/>
  <use href="#orange" xlink:href="#orange" transform="translate(110 222) rotate(-10) scale(.7)"/>

  <use href="#sparkle" xlink:href="#sparkle" transform="translate(104 34)"/>
  <use href="#sparkle" xlink:href="#sparkle" transform="translate(222 112) scale(.75)"/>
  <use href="#sparkle" xlink:href="#sparkle" transform="translate(70 120) scale(.6)"/>
  <use href="#heart" xlink:href="#heart" transform="translate(150 196) rotate(-12)"/>
  <use href="#heart" xlink:href="#heart" transform="translate(16 112) rotate(10) scale(.8)"/>

  <g fill="#f79bb8" opacity=".9"><circle cx="138" cy="80" r="2"/><circle cx="210" cy="232" r="1.8"/><circle cx="80" cy="160" r="1.6"/></g>
  <g fill="#ffc15e"><circle cx="232" cy="20" r="1.8"/><circle cx="12" cy="20" r="1.6"/><circle cx="168" cy="140" r="1.8"/></g>
</svg>
